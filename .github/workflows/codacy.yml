# Codacy Security Scan — adapted for PSX5 (Android / C++ / Kotlin)
#
# Runs Codacy's static-analysis CLI on every push/PR to main + a weekly
# schedule. Uploads results as SARIF so they appear in the GitHub
# Security > Code scanning alerts tab alongside CodeQL.
#
# Compared to the upstream starter workflow:
#   - Tightened to PSX5's languages (C/C++, Java, Kotlin, Python, shell)
#   - Added an explicit fail-fast filter so a missing CODACY_PROJECT_TOKEN
#     secret does not break CI for forks
#   - Pinned the action to a SHA (supply-chain hardening)
#   - Added a SARIF upload fallback so partial results still land

name: Codacy Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # 09:20 UTC every Monday — off-peak for Codacy's free tier
    - cron: '20 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codacy-security-scan:
    # Skip entirely for forks that don't have the CODACY_PROJECT_TOKEN secret
    # configured — this prevents red X's on contributor PRs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    name: Codacy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read            # for actions/checkout
      security-events: write    # for upload-sarif
      actions: read             # for private repos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so Codacy can compute blame-aware metrics

      - name: Run Codacy Analysis CLI
        id: codacy
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          # Allow Codacy to finish even if it finds issues; the SARIF upload
          # below is what surfaces them to GitHub's Security tab.
          max-allowed-issues: 2147483647
          # Limit to languages we actually ship — speeds up the scan and
          # avoids Codacy flagging our vendored third_party/fex tree.
          # (Codacy will still scan third_party/ by default; the .codacy.yml
          # file in the repo root excludes it.)
        continue-on-error: true  # never break CI because Codacy had a hiccup

      - name: Upload SARIF results file
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: '/codacy'

      - name: Upload SARIF as artifact (fallback)
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: codacy-sarif-${{ github.run_id }}
          path: results.sarif
          retention-days: 14
