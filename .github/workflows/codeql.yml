# CodeQL Advanced — adapted for PSX5
#
# PSX5 is an Android emulator written in:
#   - C++20  (app/src/main/cpp/ — px5 native + FEXCore vendored)
#   - Kotlin (app/src/main/java/com/px5/emulator/)
#   - Java   (app/src/main/java/com/px5/emulator/core/FexCoreWrapper.java)
#   - Python (scripts/, build helpers)
#   - GitHub Actions workflows (.github/workflows/)
#
# CodeQL matrix covers exactly those languages. The C/C++ job uses
# `build-mode: manual` because the default autobuild doesn't know about
# Android NDK + CMake; we wire in the real build below so CodeQL can
# intercept the actual compilation commands.
#
# Improvements over the upstream starter:
#   - Removed irrelevant languages (csharp, javascript-typescript, swift)
#   - Added c-cpp with manual build (Android NDK 27 + CMake 3.22.1)
#   - Added java-kotlin (Android Gradle Plugin)
#   - Pinned to ubuntu-24.04 for newer toolchain
#   - Added timeout + fail-fast=false so one language failing doesn't kill others
#   - Uploads CodeQL database as artifact for offline query debugging

name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # 11:30 UTC every Friday
    - cron: '30 11 * * 5'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      security-events: write  # required for all workflows
      packages: read          # required to fetch internal CodeQL packs
      actions: read           # required for private repos
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: java-kotlin
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # CodeQL needs full history for blame-aware queries
          fetch-depth: 0

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin' || matrix.language == 'c-cpp'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: matrix.language == 'c-cpp' || matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.3.13750724 cmake;3.22.1'

      - name: Setup Gradle
        if: matrix.language == 'java-kotlin' || matrix.language == 'c-cpp'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # Initialize CodeQL BEFORE the build so it can hook into compilation.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended + security-and-quality give us more than the
          # default suite — useful for catching subtle bugs in JIT code.
          queries: +security-extended,security-and-quality

      # C/C++ build: compile just the px5 target for arm64-v8a.
      # We use --info so CodeQL can see the actual clang++ invocations.
      - name: Build C++ (manual)
        if: matrix.language == 'c-cpp' && matrix.build-mode == 'manual'
        shell: bash
        run: |
          gradle :app:configureCMakeDebug[arm64-v8a] \
                 :app:buildCMakeDebug[arm64-v8a] \
                 --no-daemon --stacktrace 2>&1 || true
          # ^^ We use `|| true` because CodeQL only needs the compilation DB;
          #    if linking fails (e.g. on a fork without the PAT), the source
          #    analysis is still valuable.

      # Kotlin/Java: CodeQL autobuild runs `./gradlew assembleDebug` for us,
      # so build-mode: none is fine. But we still need to make sure Gradle
      # can find the NDK for any native build steps it tries.
      - name: Build Kotlin (autobuild hook)
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          # CodeQL's autobuild will run gradle; we just need to make sure
          # the env is set up correctly. Print versions for diagnostic.
          java -version
          gradle --version | head -5

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      # Upload the CodeQL database so we can run custom queries offline
      # (useful when a query finds something weird and we want to iterate
      # locally without burning CI minutes).
      - name: Upload CodeQL database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-db-${{ matrix.language }}-${{ github.run_id }}
          path: ${{ github.workspace }}/*_database
          if-no-files-found: ignore
          retention-days: 7
