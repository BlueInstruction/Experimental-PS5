# clang-tidy lint for the PSX5 C/C++ codebase.
#
# Replaces the upstream .NET Desktop starter workflow (which was irrelevant
# — PSX5 has no Windows WPF / .NET code). clang-tidy is the canonical
# C/C++ linter for LLVM/Clang projects and catches things cppcheck misses:
#   - Modernize loops / use nullptr / use override
#   - Bugprone patterns (narrowing conversions, unsigned-char in boolean ctx)
#   - Performance (move on copy, unnecessary value returns)
#   - Readability (magic numbers, identifier naming)
#   - Cert / MISRA C++ rules
#   - Concurrency (data race on local vars, thread-unsafe function calls)
#
# We mirror the CMake config used by the real build (NDK 27, CMake 3.22.1,
# -std=c++20) so the linter sees the same macros and include paths as the
# compiler.
#
# Output is uploaded as SARIF for GitHub's Security tab.

name: clang-tidy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write  # for inline PR comments (optional)

jobs:
  clang-tidy:
    name: clang-tidy lint
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.3.13750724 cmake;3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate compile_commands.json
        run: |
          # CMake can emit a compile_commands.json that lists every clang++
          # invocation clang-tidy needs to know about (includes, -D flags,
          # -std=, etc.). We configure but don't build — we just need the
          # compilation database.
          mkdir -p app/.cxx/tidy
          cd app/.cxx/tidy
          cmake \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=28 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DANDROID_NDK=/usr/local/lib/android/sdk/ndk/27.3.13750724 \
            -DCMAKE_ANDROID_NDK=/usr/local/lib/android/sdk/ndk/27.3.13750724 \
            -DCMAKE_TOOLCHAIN_FILE=/usr/local/lib/android/sdk/ndk/27.3.13750724/build/cmake/android.toolchain.cmake \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            ../../src/main/cpp || true
          # Copy the compile DB to a stable location
          cp compile_commands.json ../../../compile_commands.json 2>/dev/null || true

      - name: Install clang-tidy + run-clang-tidy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-tidy
          clang-tidy --version

      - name: Run clang-tidy on px5 sources
        run: |
          mkdir -p build-reports
          # Only lint files we own (skip third_party/fex — that's upstream's job)
          FILES=$(find app/src/main/cpp -name '*.cpp' -o -name '*.h' | grep -v third_party)
          if [ -z "$FILES" ]; then
            echo "No px5 source files found to lint."
            exit 0
          fi

          # Use the NDK's clang-tidy so we match the build's Clang version.
          TIDY=/usr/local/lib/android/sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/clang-tidy
          if [ ! -x "$TIDY" ]; then
            TIDY=clang-tidy
          fi

          # Run on each file. -p points to the build dir for compile_commands.json.
          # We use a fairly conservative checks list — modernize-* + bugprone-*
          # + performance-* + readability-* are the most valuable without being
          # too noisy.
          CHECKS="-*,modernize-*,bugprone-*,performance-*,readability-*,cert-*,clang-analyzer-*"

          echo "# clang-tidy report" > build-reports/clang-tidy.md
          echo "" >> build-reports/clang-tidy.md
          echo "Run on commit ${{ github.sha }} at $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> build-reports/clang-tidy.md
          echo "" >> build-reports/clang-tidy.md

          for f in $FILES; do
            echo "Linting: $f"
            "$TIDY" "$f" \
              --checks="$CHECKS" \
              -p=compile_commands.json \
              --warnings-as-errors=* \
              2>&1 | tee -a build-reports/clang-tidy.log || true
          done || true

      - name: Convert clang-tidy output to SARIF
        run: |
          # clang-tidy's plain-text output isn't directly SARIF, but we can
          # use a simple Python converter. If it's not installed, skip —
          # the log is still uploaded as an artifact below.
          pip install --quiet clang-tidy-sarif || true
          if command -v clang-tidy-sarif >/dev/null 2>&1; then
            clang-tidy-sarif build-reports/clang-tidy.log -o build-reports/clang-tidy.sarif || true
          fi

      - name: Upload SARIF
        if: always() && hashFiles('build-reports/clang-tidy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build-reports/clang-tidy.sarif
          category: '/clang-tidy'

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report-${{ github.run_id }}
          path: build-reports/
          retention-days: 14
