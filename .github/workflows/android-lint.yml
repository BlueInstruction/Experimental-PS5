# Android Lint for the PSX5 Kotlin/Java codebase.
#
# Runs Google's official Android Lint, then COMMITS the HTML report to:
#   diagnostic-output/<run_id>/android-lint-report/lint-results-debug.html
#
# Also uploads SARIF to GitHub's Security tab + keeps the artifact as backup.
#
# NOTE: pull_request trigger is intentionally omitted. When a PR is open,
# GitHub restricts the GITHUB_TOKEN's contents:write permission, which
# prevents the commit step from pushing the report to the repo. The
# workflow still runs on push to main/fix branches + manual dispatch.

name: Android Lint

on:
  push:
    branches: ["main", "fix/**"]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Run Android Lint
        run: |
          gradle :app:lintDebug --no-daemon --stacktrace 2>&1 | tee lint.log || true

      - name: Check for report output
        run: |
          echo "=== lint report files ==="
          ls -la app/build/reports/ 2>/dev/null || echo "No reports dir"
          echo "=== SARIF ==="
          ls -la app/build/reports/lint-results-debug.sarif 2>/dev/null || echo "No SARIF"
          echo "=== HTML ==="
          ls -la app/build/reports/lint-results-debug.html 2>/dev/null || echo "No HTML"
          echo "=== XML ==="
          ls -la app/build/reports/lint-results-debug.xml 2>/dev/null || echo "No XML"

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('app/build/reports/lint-results-debug.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: '/android-lint'
        continue-on-error: true

      - name: Publish Android Lint report to diagnostic-output/
        if: always()
        shell: bash
        run: |
          # Target directory — matches the structure the user requested:
          #   diagnostic-output/<run-id>/android-lint-report/
          OUT="diagnostic-output/${GITHUB_RUN_ID}/android-lint-report"
          mkdir -p "$OUT"

          # Copy the original Android Lint HTML report as-is.
          # Do NOT convert to Markdown or extract text.
          cp app/build/reports/lint-results-debug.html "$OUT/" 2>/dev/null || true
          cp app/build/reports/lint-results-debug.sarif "$OUT/" 2>/dev/null || true
          cp app/build/reports/lint-results-debug.xml "$OUT/" 2>/dev/null || true
          cp lint.log "$OUT/" 2>/dev/null || true

          echo "=== Files published to $OUT ==="
          ls -la "$OUT/"

          # Verify the HTML report exists
          echo ""
          echo "=== HTML report integrity check ==="
          if [ -f "$OUT/lint-results-debug.html" ]; then
            echo "  OK: lint-results-debug.html exists ($(wc -c < "$OUT/lint-results-debug.html") bytes)"
          else
            echo "  MISSING: lint-results-debug.html"
          fi

          # Commit
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic-output/
          git commit -m "chore(lint): publish android-lint report for run ${GITHUB_RUN_ID} [skip ci]" || echo "Nothing to commit"
          git push

      - name: Upload report as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report-${{ github.run_id }}
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.sarif
            app/build/reports/lint-results-*.xml
            lint.log
          if-no-files-found: ignore
          retention-days: 14
