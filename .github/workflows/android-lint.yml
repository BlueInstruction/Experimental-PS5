# Android Lint for the PSX5 Kotlin/Java codebase.
#
# Replaces the upstream Jekyll site CI starter (which was irrelevant —
# PSX5 has no Ruby/Jekyll docs site). Android Lint is Google's official
# static analyzer for Android code; it catches:
#   - Resource leaks (unclosed Cursor, InputStream, BroadcastReceiver)
#   - Deprecated API usage (targetSdk=35 catches a lot)
#   - Accessibility issues (missing contentDescription, touch target size)
#   - Internationalization (hardcoded strings, RTL issues)
#   - Security (exported components without permission, cleartext traffic)
#   - Performance (heavy work on main thread, inefficient layouts)
#   - Correctness (wrong fragment lifecycle, missing permissions)
#
# Output: HTML report as an artifact; SARIF (when AGP emits it) is
#         uploaded to GitHub's Security tab.

name: Android Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # for SARIF upload

jobs:
  android-lint:
    name: Android Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Same-repo pull_request events default to a read-only cache, which
          # produced permanent "cache is read-only / 400" annotations; there
          # is no untrusted-fork surface here, so allow saving.
          cache-read-only: false

      - name: Run Android Lint
        run: |
          # Run only the lint task — not the full assembleDebug, which
          # would also trigger the native CMake build (slow + needs NDK).
          # No `|| true` here: the step must fail when lint finds errors
          # (abortOnError), otherwise the check would be permanently green
          # no matter what lint reports.
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon --stacktrace 2>&1 | tee lint.log

      - name: Publish lint summary
        if: always()
        run: |
          # Structured findings on the run page AND in this step's job log
          # (readable via the Actions API without artifact downloads).
          # grep -E pattern matches AGP's "file:line: Severity: msg [Id]" lines.
          {
            echo "## Android Lint findings"
            echo
            if [ -f lint.log ]; then
              grep -E "Lint found" lint.log | tail -n 3
              echo
              echo '```text'
              grep -E ": (Error|Warning): " lint.log | sort -u | head -n 60
              echo '```'
              echo
              echo "By issue id:"
              echo '```text'
              grep -oE "\[[A-Za-z0-9]+\]$" lint.log | sort | uniq -c | sort -rn | head -n 15
              echo '```'
            else
              echo "lint.log was not produced."
            fi
          } | tee "$GITHUB_STEP_SUMMARY"

      - name: Check for SARIF output
        run: |
          # AGP does not emit SARIF by default; if the file is absent the
          # upload below is skipped instead of faking a report.
          if [ -f app/build/reports/lint-results-debug.sarif ]; then
            echo "SARIF found: app/build/reports/lint-results-debug.sarif"
            ls -la app/build/reports/lint-results-debug.sarif
          else
            echo "No SARIF found — Android Lint may have failed before producing it."
            ls -la app/build/reports/ 2>/dev/null || true
          fi

      - name: Upload SARIF
        if: always() && hashFiles('app/build/reports/lint-results-debug.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: '/android-lint'
        continue-on-error: true  # SARIF upload may fail if AGP version doesn't emit valid schema

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report-${{ github.run_id }}
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.sarif
            lint.log
          if-no-files-found: ignore
          retention-days: 14


