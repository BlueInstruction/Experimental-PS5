# Android Lint for the PSX5 Kotlin/Java codebase.
#
# Runs Google's official Android Lint static analyzer, then COMMITS the
# report to diagnostic-output/<run_id>/android-lint/ in the repo so the
# AI agent can read it via the Contents API (no artifact download needed).
#
# Also uploads SARIF to GitHub's Security tab + keeps the artifact as backup.

name: Android Lint

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write   # needed to commit reports to the repo
  security-events: write  # for SARIF upload

jobs:
  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Run Android Lint
        run: |
          gradle :app:lintDebug --no-daemon --stacktrace 2>&1 | tee lint.log || true

      - name: Check for report output
        run: |
          echo "=== lint report files ==="
          ls -la app/build/reports/ 2>/dev/null || echo "No reports dir"
          echo "=== SARIF ==="
          ls -la app/build/reports/lint-results-debug.sarif 2>/dev/null || echo "No SARIF"
          echo "=== HTML ==="
          ls -la app/build/reports/lint-results-debug.html 2>/dev/null || echo "No HTML"

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('app/build/reports/lint-results-debug.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: '/android-lint'
        continue-on-error: true

      - name: Commit lint report to repo
        if: always()
        shell: bash
        run: |
          # Create the diagnostic-output directory for this run
          OUT="diagnostic-output/${GITHUB_RUN_ID}/android-lint"
          mkdir -p "$OUT"

          # Copy all lint report files
          cp app/build/reports/lint-results-debug.html "$OUT/" 2>/dev/null || true
          cp app/build/reports/lint-results-debug.sarif "$OUT/" 2>/dev/null || true
          cp app/build/reports/lint-results-debug.xml "$OUT/" 2>/dev/null || true
          cp lint.log "$OUT/" 2>/dev/null || true

          # Also extract a plain-text summary of errors/warnings
          {
            echo "# Android Lint Report — Run ${{ github.run_id }}"
            echo ""
            echo "- commit: ${{ github.sha }}"
            echo "- branch: ${{ github.ref_name }}"
            echo "- date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            ## If XML report exists, extract error/warning counts
            if [ -f app/build/reports/lint-results-debug.xml ]; then
              echo "## Summary"
              echo '```'
              grep -o 'errors="[0-9]*"' app/build/reports/lint-results-debug.xml | head -1
              grep -o 'warnings="[0-9]*"' app/build/reports/lint-results-debug.xml | head -1
              echo '```'
              echo ""
              echo "## Errors (first 50)"
              echo '```'
              grep -o '<issue[^>]*severity="Error"[^>]*>' app/build/reports/lint-results-debug.xml | head -50 || echo "(none)"
              echo '```'
              echo ""
              echo "## Warnings (first 30)"
              echo '```'
              grep -o '<issue[^>]*severity="Warning"[^>]*>' app/build/reports/lint-results-debug.xml | head -30 || echo "(none)"
              echo '```'
            fi
          } > "$OUT/summary.md"

          echo "=== Files committed to $OUT ==="
          ls -la "$OUT/"

          # Commit
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic-output/
          git commit -m "chore(lint): publish android-lint report for run ${GITHUB_RUN_ID} [skip ci]" || echo "Nothing to commit"
          git push

      - name: Upload report as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report-${{ github.run_id }}
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.sarif
            app/build/reports/lint-results-*.xml
            lint.log
          if-no-files-found: ignore
          retention-days: 14
