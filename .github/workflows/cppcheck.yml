# cppcheck static analysis for the PSX5 C/C++ codebase.
#
# Runs cppcheck, generates XML + HTML reports, then COMMITS them to
# diagnostic-output/<run_id>/cppcheck/ in the repo so the AI agent
# can read them via the Contents API (no artifact download needed).
#
# Also uploads SARIF to GitHub's Security tab + keeps the artifact as backup.

name: cppcheck

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write   # needed to commit reports to the repo
  security-events: write  # for SARIF upload

jobs:
  cppcheck:
    name: cppcheck static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck
          cppcheck --version

      - name: Run cppcheck on px5 native code
        run: |
          mkdir -p build-reports

          cppcheck \
            --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --force \
            -D__ANDROID__ \
            -D__aarch64__ \
            -DARM64 \
            --platform=unix64 \
            --std=c++20 \
            --xml \
            --xml-version=2 \
            -I app/src/main/cpp \
            -I app/src/main/cpp/utils \
            -I app/src/main/cpp/core \
            -I app/src/main/cpp/memory \
            -I app/src/main/cpp/kernel \
            -I app/src/main/cpp/loader \
            -I app/src/main/cpp/gpu \
            -I app/src/main/cpp/audio \
            -I app/src/main/cpp/input \
            -I app/src/main/cpp/filesystem \
            -I app/src/main/cpp/media \
            --output-file=build-reports/cppcheck.xml \
            app/src/main/cpp/ 2>&1 | tee build-reports/cppcheck.log || true

          # Generate HTML report
          cppcheck-htmlreport --file=build-reports/cppcheck.xml \
            --report-dir=build-reports/html || true

      - name: Convert cppcheck XML to SARIF
        run: |
          set +e
          pip install --quiet cppcheck-sarif 2>/dev/null
          if command -v cppcheck-sarif >/dev/null 2>&1; then
            cppcheck-sarif build-reports/cppcheck.xml -o build-reports/cppcheck.sarif
            if [ -s build-reports/cppcheck.sarif ]; then
              echo "SARIF generated via cppcheck-sarif"
              exit 0
            fi
          fi
          # Fallback: minimal empty SARIF
          cat > build-reports/cppcheck.sarif <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [{ "tool": { "driver": { "name": "cppcheck" } }, "results": [] }]
          }
          EOF

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('build-reports/cppcheck.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build-reports/cppcheck.sarif
          category: '/cppcheck'
        continue-on-error: true

      - name: Commit cppcheck report to repo
        if: always()
        shell: bash
        run: |
          OUT="diagnostic-output/${GITHUB_RUN_ID}/cppcheck"
          mkdir -p "$OUT"

          # Copy all report files
          cp build-reports/cppcheck.xml "$OUT/" 2>/dev/null || true
          cp build-reports/cppcheck.log "$OUT/" 2>/dev/null || true
          cp build-reports/cppcheck.sarif "$OUT/" 2>/dev/null || true
          cp -r build-reports/html/* "$OUT/" 2>/dev/null || true

          # Generate a plain-text summary the AI agent can read directly
          {
            echo "# Cppcheck Report — Run ${{ github.run_id }}"
            echo ""
            echo "- commit: ${{ github.sha }}"
            echo "- branch: ${{ github.ref_name }}"
            echo "- date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "## Findings"
            echo '```'
            # Extract findings from XML: severity, id, file, line, message
            python3 -c "
import xml.etree.ElementTree as ET
import sys
try:
    tree = ET.parse('build-reports/cppcheck.xml')
    root = tree.getroot()
    errors = root.find('errors')
    if errors is not None:
        for err in errors.findall('error'):
            sev = err.get('severity', '?')
            eid = err.get('id', '?')
            msg = err.get('msg', '?')
            loc = err.find('location')
            if loc is not None:
                f = loc.get('file', '?')
                line = loc.get('line', '?')
                print(f'  [{sev:10s}] {eid:30s} {f}:{line} — {msg}')
            else:
                print(f'  [{sev:10s}] {eid:30s} — {msg}')
    else:
        print('(no errors element found)')
except Exception as e:
    print(f'(could not parse XML: {e})')
" || echo "(could not extract findings)"
            echo '```'
          } > "$OUT/summary.md"

          echo "=== Files committed to $OUT ==="
          ls -la "$OUT/"

          # Commit
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic-output/
          git commit -m "chore(diag): publish cppcheck report for run ${GITHUB_RUN_ID} [skip ci]" || echo "Nothing to commit"
          git push

      - name: Upload report as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report-${{ github.run_id }}
          path: build-reports/
          retention-days: 14
