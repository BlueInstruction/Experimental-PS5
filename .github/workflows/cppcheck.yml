# cppcheck static analysis for the PSX5 C/C++ codebase.
#
# Replaces the upstream Deno starter workflow (which was irrelevant — PSX5
# has no TypeScript). cppcheck is a free, fast static analyzer that catches:
#   - Null pointer dereferences
#   - Buffer overruns / underruns
#   - Memory leaks (double-free, use-after-free)
#   - Uninitialized variables
#   - STL misuse
#   - Bit-shift UB
#   - Integer overflow
#   - Dangerous casts
#
# Output is uploaded as SARIF so findings show up in the GitHub Security tab
# alongside CodeQL + Codacy.
#
# We exclude:
#   - third_party/fex/ — upstream code we don't own (FEXCore has its own CI)
#   - app/.cxx/         — CMake build artifacts
#   - app/build/        — Gradle build artifacts

name: cppcheck

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # for SARIF upload

jobs:
  cppcheck:
    name: cppcheck static analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck
          cppcheck --version

      - name: Run cppcheck on px5 native code
        run: |
          mkdir -p build-reports

          # We use --inline-suppr so individual lines can opt out with
          # "// cppcheck-suppress <id>" comments.
          #
          # --enable=all turns on warning,style,performance,portability
          # (but not unusedFunction — too noisy on a partial build).
          #
          # --suppress=missingIncludeSystem silences noise from system headers.
          #
          # Findings are graded by tools/cppcheck_gate.py in the next step:
          # severity=error fails the build, everything else is reported.
          # cppcheck itself must not abort here, or the gate never gets to
          # print the summary.
          cppcheck \
            --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --force \
            --inline-suppr \
            -D__ANDROID__ \
            -D__aarch64__ \
            -DARM64 \
            --platform=unix64 \
            --std=c++20 \
            --xml \
            --xml-version=2 \
            -I app/src/main/cpp \
            -I app/src/main/cpp/utils \
            -I app/src/main/cpp/core \
            -I app/src/main/cpp/memory \
            -I app/src/main/cpp/kernel \
            -I app/src/main/cpp/loader \
            -I app/src/main/cpp/gpu \
            -I app/src/main/cpp/audio \
            -I app/src/main/cpp/input \
            -I app/src/main/cpp/filesystem \
            -I app/src/main/cpp/media \
            --output-file=build-reports/cppcheck.xml \
            app/src/main/cpp/ 2>&1 | tee build-reports/cppcheck.log

          # Convert XML to SARIF for GitHub upload
          cppcheck-htmlreport --file=build-reports/cppcheck.xml \
            --report-dir=build-reports/html || true

      - name: Gate on cppcheck findings
        run: python3 tools/cppcheck_gate.py build-reports/cppcheck.xml

      - name: Convert cppcheck XML to SARIF
        run: |
          # Try multiple converters; if all fail, generate a minimal SARIF
          # ourselves so the GitHub Security tab still has something to show.
          set +e

          # Option 1: official cppcheck-sarif PyPI package
          pip install --quiet cppcheck-sarif 2>/dev/null
          if command -v cppcheck-sarif >/dev/null 2>&1; then
            cppcheck-sarif build-reports/cppcheck.xml -o build-reports/cppcheck.sarif
            if [ -s build-reports/cppcheck.sarif ]; then
              echo "SARIF generated via cppcheck-sarif"
              exit 0
            fi
          fi

          # Option 2: use Python directly with the sarif-tools package
          pip install --quiet sarif-tools 2>/dev/null
          if python -c "import sarif" 2>/dev/null; then
            # sarif-tools doesn't have a direct cppcheck converter, but
            # we can at least verify the sarif module is importable.
            :
          fi

          # Option 3: minimal inline SARIF. This exists only so the Security
          # tab upload has a well-formed file; it deliberately contains no
          # results and is NOT a pass signal. The build's actual pass/fail
          # decision is made by the "Gate on cppcheck findings" step above.
          echo "All converters failed; generating minimal empty SARIF."
          cat > build-reports/cppcheck.sarif <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "cppcheck",
                    "informationUri": "https://cppcheck.sourceforge.io/",
                    "version": "unknown"
                  }
                },
                "results": [],
                "invocations": [
                  {
                    "executionSuccessful": true,
                    "ruleConfigurationOverrides": []
                  }
                ]
              }
            ]
          }
          EOF
          echo "Minimal SARIF written to build-reports/cppcheck.sarif"

      - name: Upload SARIF
        if: always() && hashFiles('build-reports/cppcheck.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build-reports/cppcheck.sarif
          category: '/cppcheck'
        continue-on-error: true  # don't fail the workflow if SARIF upload rejects our file

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report-${{ github.run_id }}
          path: build-reports/
          retention-days: 14


