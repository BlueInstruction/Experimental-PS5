# cppcheck static analysis for the PSX5 C/C++ codebase.
#
# Runs cppcheck, generates XML + multi-file HTML reports, then COMMITS the
# COMPLETE report directory to:
#   diagnostic-output/<run_id>/cppcheck-report/
#
# The HTML report is a multi-file system (index.html + 0.html + 1.html +
# 2.html + stats.html + style.css). All files are preserved as-is so the
# HTML navigation works correctly when viewed in the GitHub repo UI.
#
# Also uploads SARIF to GitHub's Security tab + keeps the artifact as backup.
#
# NOTE: pull_request trigger is intentionally omitted. When a PR is open,
# GitHub restricts the GITHUB_TOKEN's contents:write permission, which
# prevents the commit step from pushing the report to the repo. The
# workflow still runs on push to main/fix branches + manual dispatch.

name: cppcheck

on:
  push:
    branches: ["main", "fix/**"]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  cppcheck:
    name: cppcheck static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck
          cppcheck --version

      - name: Run cppcheck on px5 native code
        run: |
          mkdir -p build-reports

          cppcheck \
            --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --force \
            -D__ANDROID__ \
            -D__aarch64__ \
            -DARM64 \
            --platform=unix64 \
            --std=c++20 \
            --xml \
            --xml-version=2 \
            -I app/src/main/cpp \
            -I app/src/main/cpp/utils \
            -I app/src/main/cpp/core \
            -I app/src/main/cpp/memory \
            -I app/src/main/cpp/kernel \
            -I app/src/main/cpp/loader \
            -I app/src/main/cpp/gpu \
            -I app/src/main/cpp/audio \
            -I app/src/main/cpp/input \
            -I app/src/main/cpp/filesystem \
            -I app/src/main/cpp/media \
            --output-file=build-reports/cppcheck.xml \
            app/src/main/cpp/ 2>&1 | tee build-reports/cppcheck.log || true

          # Generate the multi-file HTML report.
          # cppcheck-htmlreport creates a directory containing:
          #   index.html  — main report page with summary + links
          #   stats.html  — statistics page
          #   0.html, 1.html, 2.html, ... — per-file detail pages
          #   style.css   — stylesheet (required by all HTML pages)
          # These files are linked together; ALL must be preserved for the
          # report to be navigable.
          cppcheck-htmlreport --file=build-reports/cppcheck.xml \
            --report-dir=build-reports/html || true

      - name: Convert cppcheck XML to SARIF
        run: |
          set +e
          pip install --quiet cppcheck-sarif 2>/dev/null
          if command -v cppcheck-sarif >/dev/null 2>&1; then
            cppcheck-sarif build-reports/cppcheck.xml -o build-reports/cppcheck.sarif
            if [ -s build-reports/cppcheck.sarif ]; then
              echo "SARIF generated via cppcheck-sarif"
              exit 0
            fi
          fi
          cat > build-reports/cppcheck.sarif <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [{ "tool": { "driver": { "name": "cppcheck" } }, "results": [] }]
          }
          EOF

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('build-reports/cppcheck.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build-reports/cppcheck.sarif
          category: '/cppcheck'
        continue-on-error: true

      - name: Publish cppcheck report to diagnostic-output/
        if: always()
        shell: bash
        run: |
          # Target directory — matches the structure the user requested:
          #   diagnostic-output/<run-id>/cppcheck-report/
          OUT="diagnostic-output/${GITHUB_RUN_ID}/cppcheck-report"
          mkdir -p "$OUT"

          # 1. Copy the COMPLETE HTML report directory as-is.
          #    This preserves index.html, stats.html, 0.html, 1.html,
          #    2.html, style.css, and any other files cppcheck-htmlreport
          #    generated. Do NOT flatten or pick individual files.
          if [ -d build-reports/html ]; then
            cp -r build-reports/html/* "$OUT/"
            echo "Copied HTML report directory:"
            ls -la "$OUT/"
          else
            echo "WARNING: build-reports/html/ does not exist — cppcheck-htmlreport may have failed"
          fi

          # 2. Copy the raw machine-readable files without modification.
          cp build-reports/cppcheck.xml "$OUT/cppcheck.xml" 2>/dev/null || true
          cp build-reports/cppcheck.sarif "$OUT/cppcheck.sarif" 2>/dev/null || true
          cp build-reports/cppcheck.log "$OUT/cppcheck.log" 2>/dev/null || true

          echo ""
          echo "=== Final contents of $OUT ==="
          ls -la "$OUT/"

          # 3. Verify the HTML report is complete (index.html + style.css
          #    + at least one per-file page). Warn if any are missing.
          echo ""
          echo "=== HTML report integrity check ==="
          for required in index.html style.css; do
            if [ -f "$OUT/$required" ]; then
              echo "  OK: $required exists ($(wc -c < "$OUT/$required") bytes)"
            else
              echo "  MISSING: $required"
            fi
          done
          per_file_count=$(ls "$OUT"/[0-9]*.html 2>/dev/null | wc -l)
          echo "  Per-file HTML pages (0.html, 1.html, ...): $per_file_count"

          # Commit. The [skip ci] prevents re-triggering this workflow.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic-output/
          git commit -m "chore(diag): publish cppcheck report for run ${GITHUB_RUN_ID} [skip ci]" || echo "Nothing to commit"
          git push

      - name: Upload report as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report-${{ github.run_id }}
          path: build-reports/
          retention-days: 14
