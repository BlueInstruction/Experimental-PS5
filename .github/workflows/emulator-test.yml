# Android Emulator Smoke Test
#
# This workflow builds the APK, installs it on a headless Android Emulator,
# launches the app, waits 15 seconds, and captures logcat output.
#
# If the app crashes on launch (e.g. font loading error, missing resource,
# native SIGSEGV), the logcat output will contain the full stack trace
# and the workflow will FAIL — preventing a broken APK from being released.
#
# The logcat is uploaded as an artifact so the AI agent can read it
# and diagnose the crash without the user having to test manually.
#
# This is the key insight: Compose UI crashes (like "Could not load font")
# happen on the main thread's Choreographer frame callback, NOT on the
# thread that called onCreate. The on-device crash handler in
# PX5Application.kt catches these, but this CI step catches them EVEN
# EARLIER — before the APK is even uploaded as an artifact.

name: Emulator Smoke Test

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  emulator-test:
    name: Build + Install + Launch on Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.3.13750724 cmake;3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          # Verify APK exists
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK build failed — no app-debug.apk found"
            exit 1
          fi
          echo "APK built successfully:"
          ls -la app/build/outputs/apk/debug/app-debug.apk

      - name: Free disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images /opt/ghc
          echo "=== Disk space after cleanup ==="
          df -h /
      - name: Enable KVM (for hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          # The debug APK is a UNIVERSAL build: arm64-v8a carries the real
          # engine, x86_64 carries stub/ui_smoke_stub.cpp — a symbol-compatible
          # library with REAL Vulkan enumeration and NO guest engine (FEXCore
          # here translates x86-64 -> ARM64, meaningless on an x86_64 host).
          # This lets the smoke test install + launch the exact artifact on an
          # x86_64 AVD and validate Compose/resources/logic without pretending
          # to run guests.
          disk-size: 2048M
          heap-size: 512M
          sdcard-path-or-size: 100M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -wipe-data
          # x86_64 stub covers the emulator; Compose/resource crashes still
          # fire here exactly like before. Kernel-HLE/GPU/renderer bridges all
          # exist as honest stubs, so even feature paths execute safely.
          script: |
            echo "=== Emulator booted, installing APK ==="
            adb install app/build/outputs/apk/debug/app-debug.apk

            echo "=== Clearing logcat ==="
            adb logcat -c

            echo "=== Launching app ==="
            adb shell monkey -p com.px5.emulator -c android.intent.category.LAUNCHER 1

            echo "=== Waiting 15 seconds for app to start (or crash) ==="
            sleep 15

            echo "=== Dumping logcat ==="
            adb logcat -d > android_system_logs.txt 2>&1

            echo "=== Checking if app process is still alive ==="
            adb shell ps | grep com.px5.emulator || echo "APP PROCESS NOT FOUND — app crashed"

            echo "=== Pulling crash log files from device ==="
            # The crash handler writes to /sdcard/Android/data/com.px5.emulator/files/logs/
            adb shell "run-as com.px5.emulator ls files/logs/" 2>/dev/null || true
            adb shell "ls /sdcard/Android/data/com.px5.emulator/files/logs/" 2>/dev/null || true

            # Try to pull crash logs via run-as (works for debug builds)
            mkdir -p device_crash_logs
            adb shell "run-as com.px5.emulator sh -c 'cp -r files/logs /sdcard/px5_logs_backup'" 2>/dev/null || true
            adb pull /sdcard/px5_logs_backup device_crash_logs/ 2>/dev/null || true
            adb shell "rm -rf /sdcard/px5_logs_backup" 2>/dev/null || true

            # Also try the external files dir path directly
            adb pull /sdcard/Android/data/com.px5.emulator/files/logs device_crash_logs/external 2>/dev/null || true

            # NOTE: android-emulator-runner executes this script line-by-line
            # through sh -c, so every construct must be a self-contained ONE
            # physical line (multi-line if blocks fail with exit code 2).
            echo "=== Checking for crash signatures in logcat ==="
            if grep -q "FATAL EXCEPTION" android_system_logs.txt; then echo "!!! FATAL EXCEPTION DETECTED !!!"; grep -A 50 "FATAL EXCEPTION" android_system_logs.txt | head -80; exit 1; fi

            if grep -q "Could not load font" android_system_logs.txt; then echo "!!! Font loading error detected !!!"; grep -A 30 "Could not load font" android_system_logs.txt | head -50; exit 1; fi

            if grep -q "Resources\\\$NotFoundException" android_system_logs.txt; then echo "!!! Resource not found error detected !!!"; grep -A 30 "Resources\\\$NotFoundException" android_system_logs.txt | head -50; exit 1; fi

            adb shell pidof com.px5.emulator || { echo "APP PROCESS NOT FOUND after 15 s - treating as crash"; exit 1; }

            echo "=== No crash signatures detected - app launched successfully ==="

      - name: Upload logcat as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-logcat-${{ github.run_id }}
          path: |
            android_system_logs.txt
            build.log
          retention-days: 30

      - name: Upload device crash logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-crash-logs-${{ github.run_id }}
          path: device_crash_logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: px5-tested-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

