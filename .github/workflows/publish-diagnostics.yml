# Publish Diagnostics to Repository
#
# This workflow runs AFTER cppcheck.yml and android-lint.yml complete.
# It downloads their artifacts and commits the reports to:
#   diagnostic-output/<run-id>/cppcheck-report/
#   diagnostic-output/<run-id>/android-lint-report/
#
# This is the CENTRAL publisher for diagnostic-output/ — the analysis
# workflows themselves only upload artifacts (read-only permissions),
# and this workflow (which runs on the default branch via workflow_run
# trigger) has the write permissions needed to commit.
#
# The workflow_run trigger ALWAYS runs on the default branch (main),
# which means it gets full GITHUB_TOKEN permissions regardless of
# whether a PR is open. This avoids the issue that broke the previous
# approach (where cppcheck.yml/android-lint.yml tried to commit directly
# and GitHub rejected them due to PR permission restrictions).

name: Publish Diagnostics

on:
  workflow_run:
    workflows: ["cppcheck", "Android Lint"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish diagnostic reports to repo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download cppcheck artifact
        uses: actions/download-artifact@v4
        with:
          name: cppcheck-report-${{ github.event.workflow_run.id || github.run_id }}
          path: /tmp/cppcheck-artifact
        continue-on-error: true

      - name: Download android-lint artifact
        uses: actions/download-artifact@v4
        with:
          name: android-lint-report-${{ github.event.workflow_run.id || github.run_id }}
          path: /tmp/android-lint-artifact
        continue-on-error: true

      - name: Determine run ID
        id: runid
        run: |
          # When triggered by workflow_run, use the triggering workflow's run ID.
          # When triggered manually, use this workflow's run ID.
          if [ -n "${{ github.event.workflow_run.id }}" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          else
            echo "run_id=${{ github.run_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish cppcheck report
        if: always()
        run: |
          RUN_ID="${{ steps.runid.outputs.run_id }}"
          OUT="diagnostic-output/${RUN_ID}/cppcheck-report"
          mkdir -p "$OUT"

          echo "=== cppcheck artifact contents ==="
          ls -la /tmp/cppcheck-artifact/ 2>/dev/null || echo "No cppcheck artifact found"

          if [ -d /tmp/cppcheck-artifact ]; then
            # Copy the COMPLETE HTML report directory as-is
            if [ -d /tmp/cppcheck-artifact/html ]; then
              cp -r /tmp/cppcheck-artifact/html/* "$OUT/"
              echo "Copied HTML directory:"
              ls -la "$OUT/"
            fi

            # Copy raw machine-readable files without modification
            cp /tmp/cppcheck-artifact/cppcheck.xml "$OUT/" 2>/dev/null || true
            cp /tmp/cppcheck-artifact/cppcheck.sarif "$OUT/" 2>/dev/null || true
            cp /tmp/cppcheck-artifact/cppcheck.log "$OUT/" 2>/dev/null || true
          fi

          echo ""
          echo "=== Final cppcheck-report contents ==="
          ls -la "$OUT/"

          # Integrity check
          echo ""
          echo "=== HTML integrity check ==="
          for f in index.html style.css; do
            if [ -f "$OUT/$f" ]; then
              echo "  OK: $f ($(wc -c < "$OUT/$f") bytes)"
            else
              echo "  MISSING: $f"
            fi
          done
          PER_FILE=$(ls "$OUT"/[0-9]*.html 2>/dev/null | wc -l)
          echo "  Per-file HTML pages: $PER_FILE"

      - name: Publish android-lint report
        if: always()
        run: |
          RUN_ID="${{ steps.runid.outputs.run_id }}"
          OUT="diagnostic-output/${RUN_ID}/android-lint-report"
          mkdir -p "$OUT"

          echo "=== android-lint artifact contents ==="
          ls -la /tmp/android-lint-artifact/ 2>/dev/null || echo "No android-lint artifact found"

          if [ -d /tmp/android-lint-artifact ]; then
            cp /tmp/android-lint-artifact/lint-results-debug.html "$OUT/" 2>/dev/null || true
            cp /tmp/android-lint-artifact/lint-results-debug.sarif "$OUT/" 2>/dev/null || true
            cp /tmp/android-lint-artifact/lint-results-debug.xml "$OUT/" 2>/dev/null || true
            cp /tmp/android-lint-artifact/lint.log "$OUT/" 2>/dev/null || true
          fi

          echo ""
          echo "=== Final android-lint-report contents ==="
          ls -la "$OUT/"

          # Integrity check
          if [ -f "$OUT/lint-results-debug.html" ]; then
            echo "  OK: lint-results-debug.html ($(wc -c < "$OUT/lint-results-debug.html") bytes)"
          else
            echo "  MISSING: lint-results-debug.html"
          fi

      - name: Commit diagnostic reports
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic-output/
          git commit -m "chore(diag): publish lint+cppcheck reports for run ${{ steps.runid.outputs.run_id }} [skip ci]" || echo "Nothing to commit"
          git push
