name: PX5 Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    env:
      PX5_FEXCORE_ROOT: ${{ github.workspace }}/../deps/FEX
      PX5_ADRENOTOOLS_ROOT: ${{ github.workspace }}/../deps/adrenotools

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'ndk;27.3.13750724 cmake;3.22.1'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    # v1.33 hardening: some external editors / AI-studio syncs strip the
    # executable bit on round-trip (vc33 incident: fetch scripts + gradlew
    # landed as 100644 and both CI jobs died with exit 126 Permission
    # denied before Gradle even ran). Re-assert the modes here so the
    # build is immune to that class of damage.
    - name: Re-assert executable bits
      run: chmod +x gradlew tools/fetch_fexcore.sh tools/fetch_adrenotools.sh

    - name: Fetch pinned FEXCore sources
      run: ./tools/fetch_fexcore.sh

    - name: Fetch pinned libadrenotools
      run: ./tools/fetch_adrenotools.sh

    - name: Clean build cache and intermediates
      run: |
        rm -rf app/.cxx .gradle app/build .cxx

    # v1.37 — assembleRelease, NOT assembleDebug. A debuggable APK carries
    # the "debug" version badge in the system app info on Android 12+ (the
    # v1.36 session showed "1.36-debug" on the user's device); the release
    # type reports its clean versionName. It is still signed with the
    # auto-generated debug keystore (see build.gradle.kts buildTypes), so
    # the artifact installs exactly like before — no upload secrets needed.
    - name: Build Release APK
      run: gradle assembleRelease --no-daemon --stacktrace --info

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: px5-alpha-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    # v1.20 — symbolization pair for the crash reports. The crash handler
    # now emits "libpx5.so+0xOFFSET" lines; those offsets resolve to
    # functions ONLY against the UNSTRIPPED native libraries (the APK copy
    # is stripped by AGP). The pre-strip copies live in the cxx obj dirs.
    - name: Upload unstripped native libraries (for crash symbolization)
      uses: actions/upload-artifact@v4
      with:
        name: px5-native-symbols-arm64
        path: |
          app/.cxx/**/obj/arm64-v8a/*.so
          app/build/intermediates/cxx/**/obj/arm64-v8a/*.so
        if-no-files-found: warn
        retention-days: 30
