name: PX5 Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      PX5_FEXCORE_ROOT: ${{ github.workspace }}/../deps/FEX
      PX5_ADRENOTOOLS_ROOT: ${{ github.workspace }}/../deps/adrenotools

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'ndk;27.3.13750724 cmake;3.22.1'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    - name: Fetch pinned FEXCore sources
      run: ./tools/fetch_fexcore.sh

    - name: Fetch pinned libadrenotools
      run: ./tools/fetch_adrenotools.sh

    - name: Clean build cache and intermediates
      run: |
        rm -rf app/.cxx .gradle app/build .cxx

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace --info

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: px5-alpha-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
