# Template: Android app with Vulkan GPU backend
version: 1
project:
  name: my-vulkan-app
  type: android-vulkan
runtime:
  package: com.example.myapp
  activity: com.example.myapp.MainActivity
  abi: arm64-v8a
  min_sdk: 28
  target_sdk: 35
build:
  apk_path: app/build/outputs/apk/debug/app-debug.apk
  native_libs:
    - libmyapp.so
    - libvulkan.so
components: [android, native, vulkan]
probes: [build, native-loader, vulkan-dummy]
policy:
  fail_on: [P0, P1]
artifacts:
  logcat: true
  native_logs: true
  probe_results: true
