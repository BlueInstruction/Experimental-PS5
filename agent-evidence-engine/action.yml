name: 'Agent Evidence Engine'
description: 'Run deterministic runtime evidence probes and generate agent-report.json'
inputs:
  contract:
    description: 'Path to the project contract YAML file'
    required: true
    default: 'agent-evidence-engine.yml'
  fail-on:
    description: 'Severity levels that cause workflow failure (comma-separated)'
    required: false
    default: 'P0,P1'
runs:
  using: 'composite'
  steps:
    - name: Run evidence engine
      run: |
        pip install -e ./agent-evidence-engine
        aee run --contract ${{ inputs.contract }} --fail-on ${{ inputs.fail-on }}
      shell: bash
