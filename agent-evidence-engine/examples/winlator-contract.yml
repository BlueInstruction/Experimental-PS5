# Winlator contract
version: 1
project:
  name: winlator
  type: android-wine-emulator
runtime:
  package: com.winlator
  activity: com.winlator.MainActivity
  abi: arm64-v8a
build:
  apk_path: app/build/outputs/apk/debug/app-debug.apk
  native_libs:
    - libwinlator.so
components: [android, native, wine, vulkan]
probes: [build, native-loader, vulkan-dummy]
policy:
  fail_on: [P0, P1]
artifacts:
  logcat: true
  native_logs: true
