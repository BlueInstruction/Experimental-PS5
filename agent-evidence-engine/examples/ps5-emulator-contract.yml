# PS5 emulator contract for Experimental-PS5
version: 1
project:
  name: px5
  type: android-native-emulator
  description: PlayStation 5 emulator for Android ARM64
runtime:
  package: com.px5.emulator
  activity: com.px5.emulator.MainActivity
  abi: arm64-v8a
  min_sdk: 28
  target_sdk: 35
build:
  apk_path: app/build/outputs/apk/debug/app-debug.apk
  native_libs:
    - libpx5.so
components: [android, native, fex, vulkan, ps5-loader]
probes: [build, native-loader, vulkan-dummy]
policy:
  fail_on: [P0, P1]
artifacts:
  logcat: true
  native_logs: true
  probe_results: true
